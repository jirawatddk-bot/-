name: AI Facebook Isan Quote Auto Post

on:
  schedule:
    # α╣éα╕₧α╕¬α╕òα╣îα╣Çα╕ºα╕Ñα╕▓ 06:00, 12:00, 18:00 α╕Ö. (α╣Çα╕ºα╕Ñα╕▓α╣äα╕ùα╕ó)
    - cron: '0 23,5,11 * * *'
  workflow_dispatch:

jobs:
  auto-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run AI Multi-Agent Publishing Workflow
        env:
          PORT: 3000
          NODE_ENV: production
          DB_PATH: ./database/isan_quotes.db
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: gemini
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_DRY_RUN: 'false'
          CRON_SCHEDULE: '0 6,12,18 * * *'
          AUTO_SCHEDULE_ENABLED: 'true'
        run: npx ts-node src/scripts/test-workflow.ts
